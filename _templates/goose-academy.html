<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>{{title}}</title>
    <meta name="description" content="{{i18n:appDescription.short}}" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #343434;
        color: #e6eaf5;
        line-height: 1.7;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      a {
        color: #ff5151;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        max-width: 960px;
        margin: 0 auto;
        width: 100%;
      }
      .nav-back {
        font-size: 14px;
        font-weight: 600;
        color: #a8a8a8;
      }
      .nav-back:hover {
        color: #ff5151;
      }
      .lang-toggle {
        font-size: 13px;
        font-weight: 600;
        color: #888;
      }
      .lang-toggle a {
        color: #ff5151;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 24px;
        max-width: 640px;
        margin: 0 auto;
      }
      .app-icon {
        margin-bottom: 24px;
        display: block;
        width: 140px;
        height: 140px;
        border-radius: 32px;
        box-shadow:
          6px 6px 16px rgba(0, 0, 0, 0.55),
          -6px -6px 16px rgba(110, 110, 110, 0.3);
      }
      h1 {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 1px;
        margin-bottom: 8px;
        color: #e6eaf5;
      }
      .tagline {
        font-size: 16px;
        font-weight: 600;
        color: #ff5151;
        margin-bottom: 12px;
      }
      .coming-soon {
        display: inline-block;
        padding: 8px 24px;
        border-radius: 50px;
        font-size: 14px;
        font-weight: 600;
        color: #ff5151;
        background: #343434;
        box-shadow:
          inset 4px 4px 10px rgba(0, 0, 0, 0.55),
          inset -4px -4px 10px rgba(110, 110, 110, 0.35);
        margin-bottom: 24px;
      }
      .description {
        font-size: 16px;
        color: #cccccc;
        max-width: 400px;
      }
      .footer {
        text-align: center;
        padding: 40px 24px;
        max-width: 720px;
        margin: 0 auto;
        border-top: 1px solid #555;
        width: 100%;
      }
      .footer-links {
        margin-bottom: 16px;
      }
      .footer-links a {
        font-size: 14px;
        margin: 0 8px;
        color: #ff5151;
      }
      .footer .contact {
        font-size: 13px;
        color: #a8a8a8;
      }
      .footer .contact a {
        color: #a8a8a8;
      }
      .footer .contact a:hover {
        color: #ff5151;
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a class="nav-back" href="{{navBackHref}}">← pidup games</a>
      <span class="lang-toggle">{{langToggle}}</span>
    </nav>

    <main class="main">
      <img
        class="app-icon"
        src="images/goose-academy/icon.png"
        alt="Goose Academy icon"
        width="140"
        height="140"
      />
      <h1>Goose Academy</h1>
      <p class="tagline">{{i18n:appDescription.tagline}}</p>
      <span class="coming-soon">{{i18n:appDescription.badge}}</span>
      <p class="description">{{i18n:appDescription.description}}</p>
    </main>

    <footer class="footer">
      <div class="footer-links">{{footerLinks}}</div>
      <p class="contact">
        {{contactLabel}}
        <a href="mailto:pidup-games@proton.me">pidup-games@proton.me</a>
      </p>
    </footer>
  </body>
</html>
